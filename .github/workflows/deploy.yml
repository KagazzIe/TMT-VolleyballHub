name: Build and deploy a team hub

# Shared (reusable) workflow. It builds the hub from this repo's code plus a
# team's data, and publishes the result to the CALLING repo's GitHub Pages.
# Each team keeps its own site, URL and data.
#
# By default the team data is the calling repo itself (team.json,
# rotations.json, clips/). A team can keep data in a separate private repo
# instead by passing team_data_repo and a TEAM_DATA_TOKEN secret.
#
# Callers: see starter/deploy.yml. The caller must grant
# contents: read, pages: write and id-token: write.

on:
  workflow_call:
    inputs:
      team_data_repo:
        description: Repo holding the team data, as owner/name. Empty means the calling repo; "none" deploys with no team data.
        type: string
        default: ''
    secrets:
      TEAM_DATA_TOKEN:
        description: Only needed when team_data_repo is a separate private repo. Fine-grained token with Contents read on it.
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TEAM_DATA_REPO: ${{ inputs.team_data_repo || github.repository }}
    steps:
      # Use the hub code from the same commit as this workflow file, so a team
      # on @v1 gets v1 code and a team on @main gets the latest.
      - name: Find which hub version is running
        id: hub
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          repo, ref = "KagazzIe/TMT-VolleyballHub", "main"
          try:
              req = urllib.request.Request(
                  os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=tmt-hub",
                  headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              token = json.load(urllib.request.urlopen(req))["value"]
              part = token.split(".")[1]
              claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
              repo = claims["job_workflow_ref"].split("/.github/")[0]
              ref = claims["job_workflow_sha"]
          except Exception as e:
              print(f"::warning::Could not detect the hub version ({e!r}); using {repo}@{ref}")
          print(f"Hub code: {repo}@{ref}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"repo={repo}\nref={ref}\n")
          PY

      - name: Get hub code
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.hub.outputs.repo }}
          ref: ${{ steps.hub.outputs.ref }}
          persist-credentials: false

      - name: Get team data
        if: env.TEAM_DATA_REPO != 'none'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEAM_DATA_REPO }}
          token: ${{ secrets.TEAM_DATA_TOKEN || github.token }}
          path: team
          persist-credentials: false

      - name: Check team data and build clip index
        run: |
          rm -rf team/.git team/.github team/.gitignore starter AGENTS.md CLAUDE.md README.md
          mkdir -p team/clips
          python3 - <<'PY'
          import json, pathlib, sys
          team = pathlib.Path("team")
          clips = team / "clips"
          files = sorted(p.name for p in clips.glob("*.json") if p.name != "index.json")
          bad = []
          for name in files:
              try:
                  d = json.loads((clips / name).read_text(encoding="utf-8"))
                  assert isinstance(d.get("clips"), list), "no clips list"
              except Exception as e:
                  bad.append(f"clips/{name}: {e!r}")
          rot = team / "rotations.json"
          if rot.exists():
              try:
                  d = json.loads(rot.read_text(encoding="utf-8"))
                  assert d.get("format") == "tmt-rotations", "format is not tmt-rotations"
                  assert isinstance(d.get("views"), dict), "no views object"
              except Exception as e:
                  bad.append(f"rotations.json: {e!r}")
          info = team / "team.json"
          if info.exists():
              try:
                  json.loads(info.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append(f"team.json: {e!r}")
          if bad:
              print("These team data files are not valid:")
              print("\n".join(bad))
              sys.exit(1)
          (clips / "index.json").write_text(json.dumps(files, indent=2))
          print("Listed", len(files), "game file(s):", files)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
