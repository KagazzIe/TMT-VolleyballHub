name: Deploy site

# This repo's own site runs the shared workflow exactly like a team's site does,
# except it uses the workflow from this commit instead of a release tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [team-data-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      team_data_repo: ${{ vars.TEAM_DATA_REPO }}
    secrets: inherit
