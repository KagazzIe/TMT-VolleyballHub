name: Deploy site

# Demo site for the hub. It runs the shared workflow like a team's site does, but
# from this commit instead of a release tag, and with no team data.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      team_data_repo: none
