name: Deploy team hub

# Put this file at .github/workflows/deploy.yml in your PUBLIC site repo.
# That's the only file the site repo needs: the hub code comes from
# KagazzIe/TMT-VolleyballHub each time this runs.
#
# @v1   = stable releases (recommended)
# @main = every update as soon as it's published

on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays: pick up hub updates
  workflow_dispatch:
  repository_dispatch:
    types: [team-data-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: KagazzIe/TMT-VolleyballHub/.github/workflows/deploy.yml@v1
    with:
      team_data_repo: ${{ vars.TEAM_DATA_REPO }}
    secrets: inherit
